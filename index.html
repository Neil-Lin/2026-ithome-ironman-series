<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="2026 iThome 鐵人賽系列總覽"><title>2026 iThome 鐵人賽系列總覽</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="wrap"><p class="eyebrow">iTHOME IRONMAN 2026</p><h1>先選一個系列，<br><em>再開始 30 天。</em></h1><p class="lead">把 2026 iThome 鐵人賽的系列名稱集中整理，依組別快速找到想看的完整文章旅程。</p><p id="updated" class="updated">資料載入中…</p></div></header>
<main class="wrap"><div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜尋系列名稱…" aria-label="搜尋系列名稱"></label><select id="group" aria-label="依組別篩選"><option value="全部">全部組別</option></select></div><p id="count" class="count"></p><section id="list" class="list" aria-live="polite"><p>正在載入系列…</p></section></main><footer class="wrap"><span>資料來源：iThome 2026 鐵人賽選手列表</span><a href="https://ithelp.ithome.com.tw/2026ironman/contest#ir-list">前往官方頁面 ↗</a></footer>
<script>const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Taipei'}).format(new Date(v)):'尚未更新';fetch('data/series.json?v='+Date.now()).then(r=>r.json()).then(data=>{document.querySelector('#updated').textContent='最後更新｜'+fmt(data.updatedAt);const select=document.querySelector('#group');[...new Set(data.series.map(s=>s.group))].sort().forEach(g=>select.insertAdjacentHTML('beforeend',`<option>${esc(g)}</option>`));const render=()=>{const q=document.querySelector('#search').value.toLowerCase();const g=select.value;const list=data.series.filter(s=>(g==='全部'||s.group===g)&&s.title.toLowerCase().includes(q));document.querySelector('#count').textContent=`共 ${list.length} 個系列`;document.querySelector('#list').innerHTML=list.length?list.map((s,i)=>`<a class="card" href="${esc(s.url)}" target="_blank" rel="noopener"><span class="number">${String(i+1).padStart(2,'0')}</span><span class="group">${esc(s.group)}</span><h2>${esc(s.title)}</h2><span class="open">查看 30 天文章 ↗</span></a>`).join(''):'<p class="empty">找不到符合條件的系列。</p>'};document.querySelector('#search').oninput=render;select.onchange=render;render()}).catch(()=>document.querySelector('#list').innerHTML='<p class="empty">暫時無法載入系列資料。</p>');</script></body></html>
